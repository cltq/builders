name: Build packages

on:
  push:
    branches: [main, master]
    paths:
      - packages.json
      - .github/workflows/build.yml
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force build all packages regardless of version'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Check versions
    runs-on: ubuntu-latest
    outputs:
      fast_matrix: ${{ steps.set-matrix.outputs.fast_matrix }}
      slow_matrix:  ${{ steps.set-matrix.outputs.slow_matrix }}
      has_fast:     ${{ steps.set-matrix.outputs.has_fast }}
      has_slow:     ${{ steps.set-matrix.outputs.has_slow }}

    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        env:
          TRIGGER:   ${{ github.event_name }}
          FORCE_ALL: ${{ github.event.inputs.force_all || 'false' }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request

          trigger   = os.environ["TRIGGER"]
          force_all = os.environ["FORCE_ALL"] == "true"

          with open("packages.json") as f:
              packages = json.load(f)

          try:
              with open("versions.json") as f:
                  known = json.load(f)
          except FileNotFoundError:
              known = {}

          def aur_version(name):
              try:
                  with urllib.request.urlopen(f"https://aur.archlinux.org/rpc/v5/info/{name}", timeout=10) as r:
                      data = json.loads(r.read())
                  return data["results"][0]["Version"]
              except:
                  return None

          fast, slow = [], []

          for pkg in packages:
              name = pkg["name"]
              aur  = pkg.get("aur_name", name)
              watch = pkg.get("watch", False)
              slow_flag = pkg.get("slow", False)

              if trigger == "schedule" and not force_all:
                  if not watch:
                      continue
                  latest = aur_version(aur)
                  if not latest or known.get(name) == latest:
                      continue

              entry = {"name": name, "aur_name": aur, "description": pkg.get("description", "")}
              (slow if slow_flag else fast).append(entry)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              import json
              out.write(f"fast_matrix={json.dumps({'include': fast})}\n")
              out.write(f"slow_matrix={json.dumps({'include': slow})}\n")
              out.write(f"has_fast={'true' if fast else 'false'}\n")
              out.write(f"has_slow={'true' if slow else 'false'}\n")
          EOF

  build_fast:
    needs: check
    if: needs.check.outputs.has_fast == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.fast_matrix) }}

    steps:
      - run: pacman -Syu --noconfirm && pacman -S --noconfirm git base-devel sudo curl go

      - run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - run: |
          git clone https://aur.archlinux.org/${{ matrix.aur_name }}.git /build
          chown -R builder:builder /build

      - run: |
          git clone https://aur.archlinux.org/yay.git /yay
          chown -R builder:builder /yay
          su builder -c "cd /yay && makepkg -si --noconfirm --skipchecksums"

      - run: |
          su builder -c "
            cd /build
            source PKGBUILD || true
            DEPS=()
            [ -n \"\${depends[*]+x}\" ] && DEPS+=(\"\${depends[@]}\")
            [ -n \"\${makedepends[*]+x}\" ] && DEPS+=(\"\${makedepends[@]}\")
            [ \${#DEPS[@]} -gt 0 ] && yay -S --noconfirm --needed --asdeps \"\${DEPS[@]}\" || true
          "

      - run: |
          su builder -c "cd /build && makepkg -s --noconfirm --skipchecksums"

      - id: sanitize
        run: |
          PKG_FILE=$(ls /build/*.pkg.tar.zst | head -n1)
          NAME=$(basename "$PKG_FILE")
          SAFE=$(echo "$NAME" | tr ':"<>|*?\r\n' '_')

          if [ "$NAME" != "$SAFE" ]; then
            mv "$PKG_FILE" "/build/$SAFE"
          fi

          find /build -type f -name "*.pkg.tar.zst" ! -name "$SAFE" -delete

          if ls /build/*.pkg.tar.zst | grep -q ':'; then
            echo "Unsafe filename remains"
            exit 1
          fi

          echo "file=$SAFE" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-fast-${{ matrix.name }}
          path: |
            /build/*.pkg.tar.zst

  build_slow:
    needs: check
    if: needs.check.outputs.has_slow == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.slow_matrix) }}

    steps:
      - run: pacman -Syu --noconfirm && pacman -S --noconfirm git base-devel sudo curl go

      - run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - run: |
          git clone https://aur.archlinux.org/${{ matrix.aur_name }}.git /build
          chown -R builder:builder /build

      - run: |
          git clone https://aur.archlinux.org/yay.git /yay
          chown -R builder:builder /yay
          su builder -c "cd /yay && makepkg -si --noconfirm --skipchecksums"

      - run: |
          su builder -c "cd /build && makepkg -s --noconfirm --skipchecksums"

      - id: sanitize
        run: |
          PKG_FILE=$(ls /build/*.pkg.tar.zst | head -n1)
          NAME=$(basename "$PKG_FILE")
          SAFE=$(echo "$NAME" | tr ':"<>|*?\r\n' '_')

          if [ "$NAME" != "$SAFE" ]; then
            mv "$PKG_FILE" "/build/$SAFE"
          fi

          find /build -type f -name "*.pkg.tar.zst" ! -name "$SAFE" -delete

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-slow-${{ matrix.name }}
          path: |
            /build/*.pkg.tar.zst
