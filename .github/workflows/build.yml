name: Build packages

on:
  push:
    branches: [main, master]
    paths:
      - packages.json
      - .github/workflows/build.yml
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force build all packages regardless of version'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Check versions
    runs-on: ubuntu-latest
    outputs:
      fast_matrix: ${{ steps.set-matrix.outputs.fast_matrix }}
      slow_matrix:  ${{ steps.set-matrix.outputs.slow_matrix }}
      has_fast:     ${{ steps.set-matrix.outputs.has_fast }}
      has_slow:     ${{ steps.set-matrix.outputs.has_slow }}
      build_matrix: ${{ steps.set-matrix.outputs.build_matrix }}

    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        env:
          TRIGGER:   ${{ github.event_name }}
          FORCE_ALL: ${{ github.event.inputs.force_all || 'false' }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request

          trigger   = os.environ["TRIGGER"]
          force_all = os.environ["FORCE_ALL"] == "true"

          with open("packages.json") as f:
              packages = json.load(f)

          try:
              with open("versions.json") as f:
                  known = json.load(f)
          except FileNotFoundError:
              known = {}

          def aur_version(name):
              try:
                  with urllib.request.urlopen(f"https://aur.archlinux.org/rpc/v5/info/{name}", timeout=10) as r:
                      data = json.loads(r.read())
                  return data["results"]["Version"]
              except:
                  return None

          fast, slow = [], []

          for pkg in packages:
              name = pkg["name"]
              aur  = pkg.get("aur_name", name)
              watch = pkg.get("watch", False)
              slow_flag = pkg.get("slow", False)

              if trigger == "schedule" and not force_all:
                  if not watch:
                      continue
                  latest = aur_version(aur)
                  if not latest or known.get(name) == latest:
                      continue

              entry = {"name": name, "aur_name": aur, "description": pkg.get("description", "")}
              (slow if slow_flag else fast).append(entry)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              import json
              out.write(f"fast_matrix={json.dumps({'include': fast})}\n")
              out.write(f"slow_matrix={json.dumps({'include': slow})}\n")
              out.write(f"has_fast={'true' if fast else 'false'}\n")
              out.write(f"has_slow={'true' if slow else 'false'}\n")
              out.write(f"has_packages={'true' if (fast + slow) else 'false'}\n")
          EOF

  build_fast:
    needs: check
    if: needs.check.outputs.has_fast == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.fast_matrix) }}

    steps:
      - run: pacman -Syu --noconfirm && pacman -S --noconfirm git base-devel sudo curl go

      - name: Setup builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Clone AUR package
        run: |
          git clone https://aur.archlinux.org/${{ matrix.aur_name }}.git /build
          chown -R builder:builder /build

      - name: Clone and build yay
        run: |
          git clone https://aur.archlinux.org/yay.git /yay
          chown -R builder:builder /yay
          su builder -c "cd /yay && makepkg -si --noconfirm --skipchecksums"

      - name: Install dependencies
        run: |
          su builder -c "
            cd /build
            source PKGBUILD || true
            DEPS=()
            [ -n \"\${depends[*]+x}\" ] && DEPS+=(\"\${depends[@]}\")
            [ -n \"\${makedepends[*]+x}\" ] && DEPS+=(\"\${makedepends[@]}\")
            [ \${#DEPS[@]} -gt 0 ] && yay -S --noconfirm --needed --asdeps \"\${DEPS[@]}\" || true
          "

      - name: Build package
        run: |
          echo "Files in /build before build:"
          ls -la /build/
          
          su builder -c "cd /build && makepkg -s --noconfirm --skipchecksums --skippgpcheck"
          
          echo "Files in /build after build:"
          ls -la /build/
          
          PKG_COUNT=$(ls /build/*.pkg.tar.zst 2>/dev/null | wc -l)
          if [ "$PKG_COUNT" -eq 0 ]; then
            echo "ERROR: Build failed - no package generated"
            exit 1
          fi
          echo "Package generated successfully"

      - name: Sanitize filenames
        run: |
          cd /build
          echo "Package files before:"
          ls -la *.pkg.tar.zst 2>/dev/null || true

          for f in *.pkg.tar.zst; do
            [ -e "$f" ] || continue
            NEWF=$(echo "$f" | sed 's/:/_/g')
            if [ "$f" != "$NEWF" ]; then
              mv "$f" "$NEWF"
              echo "Sanitized: $f -> $NEWF"
            fi
          done

          echo "Package files after:"
          ls -la *.pkg.tar.zst 2>/dev/null || true

          MAIN_PKG=$(ls *.pkg.tar.zst 2>/dev/null | head -n1)
          if [ -z "$MAIN_PKG" ]; then
            echo "ERROR: No package file found"
            exit 1
          fi
          echo "file=$MAIN_PKG" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-fast-${{ matrix.name }}
          path: |
            /build/*.pkg.tar.zst

  build_slow:
    needs: check
    if: needs.check.outputs.has_slow == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.slow_matrix) }}

    steps:
      - run: pacman -Syu --noconfirm && pacman -S --noconfirm git base-devel sudo curl go

      - name: Setup builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Clone AUR package
        run: |
          git clone https://aur.archlinux.org/${{ matrix.aur_name }}.git /build
          chown -R builder:builder /build

      - name: Clone and build yay
        run: |
          git clone https://aur.archlinux.org/yay.git /yay
          chown -R builder:builder /yay
          su builder -c "cd /yay && makepkg -si --noconfirm --skipchecksums"

      - name: Build package
        run: |
          su builder -c "cd /build && makepkg -s --noconfirm --skipchecksums --skippgpcheck"

      - name: Sanitize filenames
        run: |
          cd /build
          echo "Package files before:"
          ls -la *.pkg.tar.zst 2>/dev/null || true

          for f in *.pkg.tar.zst; do
            [ -e "$f" ] || continue
            NEWF=$(echo "$f" | sed 's/:/_/g')
            if [ "$f" != "$NEWF" ]; then
              mv "$f" "$NEWF"
              echo "Sanitized: $f -> $NEWF"
            fi
          done

          echo "Package files after:"
          ls -la *.pkg.tar.zst 2>/dev/null || true

          MAIN_PKG=$(ls *.pkg.tar.zst 2>/dev/null | head -n1)
          if [ -z "$MAIN_PKG" ]; then
            echo "ERROR: No package file found"
            exit 1
          fi
          echo "file=$MAIN_PKG" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-slow-${{ matrix.name }}
          path: |
            /build/*.pkg.tar.zst

  assemble_fast:
    name: Deploy fast packages
    needs: build_fast
    if: needs.check.outputs.has_fast == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm && pacman -S --noconfirm pacman-contrib git python python

      - name: Download fast artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build repo
        run: |
          mkdir repo
          find artifacts -name "*.pkg.tar.zst" -exec cp {} repo/ \;
          cd repo
          repo-add builders.db.tar.gz *.pkg.tar.zst

      - name: Generate index
        run: |
          cd repo
          python3 - <<'PYEOF'
          import os
          pkgs = sorted([f for f in os.listdir('.') if f.endswith('.pkg.tar.zst')])
          html = '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<title>Builders Repository</title>\n<style>\nbody { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }\ntable { width: 100%; border-collapse: collapse; }\nth, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }\nth { background: #f5f5f5; }\na { color: #0066cc; text-decoration: none; }\na:hover { text-decoration: underline; }\n</style>\n</head>\n<body>\n<h1>Builders Repository</h1>\n<p>Add to pacman.conf:</p>\n<pre>[builders]\nServer = https://cltq.github.io/builders/$repo</pre>\n<table>\n<tr><th>Package</th><th>Size</th></tr>\n'
          for p in pkgs:
            size = os.path.getsize(p)
            size_h = f"{size//1024} KB" if size < 1024*1024 else f"{size//1024//1024} MB"
            html += f'<tr><td><a href="{p}">{p}</a></td><td>{size_h}</td></tr>\n'
          html += '</table>\n</body>\n</html>\n'
          with open('index.html', 'w') as f:
            f.write(html)
          print(f"Generated index with {len(pkgs)} packages")
          PYEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - name: Deploy
        uses: actions/deploy-pages@v4

  assemble_all:
    name: Deploy all packages
    needs: [build_fast, build_slow]
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm && pacman -S --noconfirm pacman-contrib git python

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build repo database
        run: |
          mkdir repo
          find artifacts -name "*.pkg.tar.zst" -exec cp {} repo/ \;

          if [ -z "$(ls repo/*.pkg.tar.zst 2>/dev/null)" ]; then
            echo "No packages to build"
            exit 0
          fi

          cd repo
          repo-add builders.db.tar.gz *.pkg.tar.zst

      - name: Generate index
        run: |
          cd repo
          python3 - <<'PYEOF'
          import os
          pkgs = sorted([f for f in os.listdir('.') if f.endswith('.pkg.tar.zst')])
          html = '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<title>Builders Repository</title>\n<style>\nbody { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }\ntable { width: 100%; border-collapse: collapse; }\nth, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }\nth { background: #f5f5f5; }\na { color: #0066cc; text-decoration: none; }\na:hover { text-decoration: underline; }\n</style>\n</head>\n<body>\n<h1>Builders Repository</h1>\n<p>Add to pacman.conf:</p>\n<pre>[builders]\nServer = https://cltq.github.io/builders/$repo</pre>\n<table>\n<tr><th>Package</th><th>Size</th></tr>\n'
          for p in pkgs:
            size = os.path.getsize(p)
            size_h = f"{size//1024} KB" if size < 1024*1024 else f"{size//1024//1024} MB"
            html += f'<tr><td><a href="{p}">{p}</a></td><td>{size_h}</td></tr>\n'
          html += '</table>\n</body>\n</html>\n'
          with open('index.html', 'w') as f:
            f.write(html)
          print(f"Generated index with {len(pkgs)} packages")
          PYEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - name: Deploy
        uses: actions/deploy-pages@v4