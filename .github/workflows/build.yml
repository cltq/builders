name: Build packages

on:
  push:
    branches: [main, master]
    paths:
      - packages.json
      - .github/workflows/build.yml
  schedule:
    - cron: '0 4 * * *'   # daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force build all packages regardless of version'
        type: boolean
        default: false

permissions:
  contents: write   # for committing updated versions.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# JOB 1 — decide which packages need building
# ---------------------------------------------------------------------------
jobs:
  check:
    name: Check versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_packages: ${{ steps.set-matrix.outputs.has_packages }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Resolve build matrix
        id: set-matrix
        env:
          TRIGGER: ${{ github.event_name }}
          FORCE_ALL: ${{ github.event.inputs.force_all || 'false' }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request

          trigger   = os.environ["TRIGGER"]
          force_all = os.environ["FORCE_ALL"] == "true"

          with open("packages.json") as f:
              packages = json.load(f)

          try:
              with open("versions.json") as f:
                  known = json.load(f)
          except FileNotFoundError:
              known = {}

          def aur_version(aur_name):
              url = f"https://aur.archlinux.org/rpc/v5/info/{aur_name}"
              try:
                  with urllib.request.urlopen(url, timeout=10) as r:
                      data = json.loads(r.read())
                  results = data.get("results", [])
                  return results[0]["Version"] if results else None
              except Exception as e:
                  print(f"  AUR lookup failed for {aur_name}: {e}")
                  return None

          matrix = []
          for pkg in packages:
              name     = pkg["name"]
              aur_name = pkg.get("aur_name", name)
              watch    = pkg.get("watch", False)
              desc     = pkg.get("description", "")

              if trigger == "schedule" and not force_all:
                  if not watch:
                      print(f"  skip {name}: watch=false")
                      continue
                  latest = aur_version(aur_name)
                  if latest is None:
                      print(f"  skip {name}: AUR lookup failed")
                      continue
                  if known.get(name) == latest:
                      print(f"  skip {name}: already at {latest}")
                      continue
                  print(f"  queue {name}: {known.get(name, 'new')} → {latest}")
              else:
                  print(f"  queue {name}: forced/push build")

              matrix.append({
                  "name":        name,
                  "aur_name":    aur_name,
                  "description": desc,
              })

          has_packages = len(matrix) > 0
          print(f"\n{len(matrix)} package(s) queued: {[m['name'] for m in matrix]}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps({'include': matrix})}\n")
              out.write(f"has_packages={'true' if has_packages else 'false'}\n")
          EOF

# ---------------------------------------------------------------------------
# JOB 2 — build each package in its own parallel isolated environment
# ---------------------------------------------------------------------------
  build:
    name: "Build: ${{ matrix.name }}"
    needs: check
    if: needs.check.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}

    steps:
      - name: Update system & install base dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git base-devel sudo curl

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Clone AUR repo
        run: |
          git clone https://aur.archlinux.org/${{ matrix.aur_name }}.git /build
          chown -R builder:builder /build

      - name: Install dependencies from PKGBUILD
        run: |
          su builder -c "
            cd /build
            source ./PKGBUILD 2>/dev/null || true
            DEPS=()
            [ -n \"\${depends[*]+x}\"     ] && DEPS+=(\"\${depends[@]}\")
            [ -n \"\${makedepends[*]+x}\" ] && DEPS+=(\"\${makedepends[@]}\")
            if [ \${#DEPS[@]} -gt 0 ]; then
              sudo pacman -S --noconfirm --needed \"\${DEPS[@]}\" || true
            fi
          "

      - name: Build .pkg.tar.zst
        run: |
          su builder -c "
            cd /build
            makepkg -s --noconfirm --noprogressbar
          "

      - name: Collect package info
        id: info
        run: |
          PKG_FILE=$(ls /build/*.pkg.tar.zst | head -n1)
          PKG_FILENAME=$(basename "$PKG_FILE")
          PKG_VERSION=$(echo "$PKG_FILENAME" \
            | sed "s/^${{ matrix.name }}-//" \
            | sed 's/-[^-]*\.pkg\.tar\.zst$//')
          echo "filename=$PKG_FILENAME" >> $GITHUB_OUTPUT
          echo "version=$PKG_VERSION"   >> $GITHUB_OUTPUT

      - name: Write package metadata
        run: |
          cat > /build/meta.json <<JSON
          {
            "name":        "${{ matrix.name }}",
            "aur_name":    "${{ matrix.aur_name }}",
            "description": "${{ matrix.description }}",
            "version":     "${{ steps.info.outputs.version }}",
            "filename":    "${{ steps.info.outputs.filename }}",
            "built_at":    "$(date -u '+%Y-%m-%d %H:%M UTC')",
            "commit":      "${{ github.sha }}"
          }
          JSON

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: |
            /build/*.pkg.tar.zst
            /build/meta.json

# ---------------------------------------------------------------------------
# JOB 3 — collect all artifacts, generate pacman repo db, build site, deploy
# ---------------------------------------------------------------------------
  assemble:
    name: Assemble & Deploy
    needs: build
    runs-on: ubuntu-latest
    # Arch container so we have repo-add available
    container:
      image: archlinux:latest
    if: github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: https://cltq.github.io/builders/

    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm git python

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: artifacts

      - name: Build Pages site + pacman repo database
        run: |
          mkdir -p site
          VERSIONS_JSON="{}"
          CARDS_HTML=""
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          # ----------------------------------------------------------------
          # Process each built package
          # ----------------------------------------------------------------
          for PKG_DIR in artifacts/pkg-*/; do
            META="$PKG_DIR/meta.json"
            PKG_FILE=$(ls "$PKG_DIR"/*.pkg.tar.zst 2>/dev/null | head -n1)

            [ -f "$META" ]     || continue
            [ -f "$PKG_FILE" ] || continue

            NAME=$(python3     -c "import json; d=json.load(open('$META')); print(d['name'])")
            DESC=$(python3     -c "import json; d=json.load(open('$META')); print(d['description'])")
            VERSION=$(python3  -c "import json; d=json.load(open('$META')); print(d['version'])")
            FILENAME=$(python3 -c "import json; d=json.load(open('$META')); print(d['filename'])")
            BUILT_AT=$(python3 -c "import json; d=json.load(open('$META')); print(d['built_at'])")

            # Track version for versions.json commit
            VERSIONS_JSON=$(python3 -c "
          import json, os
          v = json.loads('$VERSIONS_JSON')
          v['$NAME'] = '$VERSION'
          print(json.dumps(v))
          ")

            # Copy package into site root (where pacman will fetch it)
            # and also into site/<name>/ for the per-package page download link
            cp "$PKG_FILE" "site/$FILENAME"
            mkdir -p "site/$NAME"
            cp "$PKG_FILE" "site/$NAME/$FILENAME"
            cp "$META"     "site/$NAME/meta.json"

            # ----------------------------------------------------------------
            # Per-package page
            # ----------------------------------------------------------------
            cat > "site/$NAME/index.html" <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
            <title>${NAME} — builders</title>
            <style>
              *{box-sizing:border-box;margin:0;padding:0}
              body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,monospace;background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
              .card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:2.5rem 3rem;max-width:600px;width:100%}
              .back{display:inline-flex;align-items:center;gap:.4rem;color:#58a6ff;font-size:.82rem;text-decoration:none;margin-bottom:1.5rem}
              .back:hover{text-decoration:underline}
              .badge{display:inline-block;background:#388bfd22;color:#58a6ff;border:1px solid #388bfd55;border-radius:999px;font-size:.75rem;padding:2px 10px;margin-bottom:1rem;letter-spacing:.04em;text-transform:uppercase}
              h1{font-size:1.8rem;font-weight:700;margin-bottom:.3rem}
              .subtitle{color:#8b949e;font-size:.9rem;margin-bottom:2rem}
              .meta{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:1rem 1.2rem;font-size:.82rem;color:#8b949e;margin-bottom:2rem;display:grid;gap:.4rem}
              .meta span{color:#e6edf3}
              .dl-btn{display:inline-flex;align-items:center;gap:.6rem;background:#238636;color:#fff;text-decoration:none;padding:.75rem 1.4rem;border-radius:8px;font-weight:600;font-size:.95rem;transition:background .15s}
              .dl-btn:hover{background:#2ea043}
              h2{font-size:1rem;font-weight:600;margin:2rem 0 .6rem;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;font-size:.75rem}
              .cmd{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:.7rem 1rem;font-size:.82rem;color:#79c0ff;word-break:break-all;cursor:pointer;font-family:monospace;position:relative}
              .cmd:hover{border-color:#58a6ff}
              .cmd::after{content:"click to copy";position:absolute;right:.7rem;top:50%;transform:translateY(-50%);font-size:.7rem;color:#484f58}
              .cmd:active::after{content:"copied!";color:#3fb950}
              .section{margin-top:1.5rem}
            </style>
          </head>
          <body>
            <div class="card">
              <a class="back" href="..">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M7.78 12.53a.75.75 0 0 1-1.06 0L2.47 8.28a.75.75 0 0 1 0-1.06l4.25-4.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042L4.81 7h7.44a.75.75 0 0 1 0 1.5H4.81l2.97 2.97a.75.75 0 0 1 0 1.06Z"/></svg>
                All packages
              </a>
              <div class="badge">Latest Build</div>
              <h1>${NAME}</h1>
              <p class="subtitle">${DESC}</p>
              <div class="meta">
                <div>Version &nbsp;<span>${VERSION}</span></div>
                <div>File &nbsp;<span>${FILENAME}</span></div>
                <div>Built &nbsp;<span>${BUILT_AT}</span></div>
                <div>Target &nbsp;<span>linux/x86_64 (Arch Linux)</span></div>
              </div>
              <a class="dl-btn" href="${FILENAME}" download="${FILENAME}">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M7.47 10.78a.75.75 0 0 0 1.06 0l3.75-3.75a.75.75 0 0 0-1.06-1.06L8.75 8.44V1.75a.75.75 0 0 0-1.5 0v6.69L4.78 5.97a.75.75 0 0 0-1.06 1.06l3.75 3.75Z"/>
                  <path d="M1.75 13.5a.75.75 0 0 0 0 1.5h12.5a.75.75 0 0 0 0-1.5H1.75Z"/>
                </svg>
                Download ${FILENAME}
              </a>

              <div class="section">
                <h2>Install via pacman repo (recommended)</h2>
                <p style="font-size:.82rem;color:#8b949e;margin-bottom:.5rem">Add to <code style="color:#e6edf3">/etc/pacman.conf</code> once, then install any package from this repo:</p>
                <div class="cmd" onclick="navigator.clipboard.writeText('[builders]\nServer = https://cltq.github.io/builders')">[builders]
          Server = https://cltq.github.io/builders</div>
                <div class="cmd" style="margin-top:.5rem" onclick="navigator.clipboard.writeText('sudo pacman -Sy ${NAME}')">sudo pacman -Sy ${NAME}</div>
              </div>

              <div class="section">
                <h2>One-off install without adding repo</h2>
                <div class="cmd" onclick="navigator.clipboard.writeText('sudo pacman -U https://cltq.github.io/builders/${FILENAME}')">sudo pacman -U https://cltq.github.io/builders/${FILENAME}</div>
              </div>
            </div>
            <script>
              document.querySelectorAll('.cmd').forEach(el => {
                el.addEventListener('click', () => {
                  el.style.borderColor = '#3fb950';
                  setTimeout(() => el.style.borderColor = '', 1200);
                });
              });
            </script>
          </body>
          </html>
          HTML

            CARDS_HTML="${CARDS_HTML}
              <a class=\"pkg-card\" href=\"${NAME}/\">
                <div class=\"pkg-name\">${NAME}</div>
                <div class=\"pkg-desc\">${DESC}</div>
                <div class=\"pkg-meta\">
                  <span class=\"pkg-version\">${VERSION}</span>
                  <span class=\"pkg-date\">${BUILT_AT}</span>
                  <span class=\"arrow\">→</span>
                </div>
              </a>"
          done

          # ----------------------------------------------------------------
          # Generate pacman repo database from ALL .pkg.tar.zst in site/
          # repo-add produces builders.db.tar.gz and builders.files.tar.gz
          # and symlinks builders.db / builders.files pointing to them
          # ----------------------------------------------------------------
          cd site
          repo-add --new --remove builders.db.tar.gz *.pkg.tar.zst
          cd ..

          # ----------------------------------------------------------------
          # Root index page
          # ----------------------------------------------------------------
          cat > site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
            <title>builders — cltq</title>
            <style>
              *{box-sizing:border-box;margin:0;padding:0}
              body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,monospace;background:#0d1117;color:#e6edf3;min-height:100vh;padding:3rem 2rem}
              .wrap{max-width:860px;margin:0 auto}
              header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:1rem;border-bottom:1px solid #30363d;padding-bottom:1.5rem;margin-bottom:2rem}
              header h1{font-size:1.5rem;font-weight:700}
              header p{color:#8b949e;font-size:.85rem}
              header a{color:#58a6ff}
              .setup{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:1.4rem 1.6rem;margin-bottom:2rem}
              .setup h2{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#8b949e;margin-bottom:.8rem}
              .setup p{font-size:.82rem;color:#8b949e;margin-bottom:.6rem}
              .cmd{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:.6rem 1rem;font-size:.82rem;color:#79c0ff;font-family:monospace;cursor:pointer;display:block;margin-bottom:.4rem;position:relative;word-break:break-all}
              .cmd:hover{border-color:#58a6ff}
              .cmd::after{content:"click to copy";position:absolute;right:.7rem;top:50%;transform:translateY(-50%);font-size:.7rem;color:#484f58;white-space:nowrap}
              .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
              .pkg-card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:1.4rem 1.6rem;text-decoration:none;color:inherit;transition:border-color .15s,background .15s;display:flex;flex-direction:column;gap:.5rem}
              .pkg-card:hover{border-color:#58a6ff;background:#1c2230}
              .pkg-name{font-size:1.05rem;font-weight:600;color:#e6edf3}
              .pkg-desc{font-size:.82rem;color:#8b949e;flex:1}
              .pkg-meta{display:flex;align-items:center;justify-content:space-between;margin-top:.6rem;gap:.5rem;flex-wrap:wrap}
              .pkg-version{font-size:.78rem;color:#79c0ff;font-family:monospace}
              .pkg-date{font-size:.75rem;color:#484f58}
              .arrow{color:#30363d;margin-left:auto}
              .pkg-card:hover .arrow{color:#58a6ff}
            </style>
          </head>
          <body>
            <div class="wrap">
              <header>
                <div>
                  <h1>builders</h1>
                  <p>Pre-built Arch Linux packages — <a href="https://github.com/cltq/builders">cltq/builders</a></p>
                </div>
                <p style="color:#484f58;font-size:.8rem">${BUILD_DATE}</p>
              </header>

              <div class="setup">
                <h2>Add as pacman repository</h2>
                <p>Add the following to the end of <code style="color:#e6edf3">/etc/pacman.conf</code>, then you can install any package below with a regular <code style="color:#e6edf3">pacman -S</code>:</p>
                <div class="cmd" onclick="navigator.clipboard.writeText('[builders]\nServer = https://cltq.github.io/builders')">[builders]
          Server = https://cltq.github.io/builders</div>
                <div class="cmd" onclick="navigator.clipboard.writeText('sudo pacman -Sy')">sudo pacman -Sy &nbsp;<span style="color:#484f58"># sync package databases</span></div>
              </div>

              <div class="grid">
                ${CARDS_HTML}
              </div>
            </div>
            <script>
              document.querySelectorAll('.cmd').forEach(el => {
                el.addEventListener('click', () => {
                  navigator.clipboard.writeText(el.innerText.split('#')[0].trim());
                  el.style.borderColor = '#3fb950';
                  setTimeout(() => el.style.borderColor = '', 1200);
                });
              });
            </script>
          </body>
          </html>
          HTML

          echo "VERSIONS_JSON=$VERSIONS_JSON" >> $GITHUB_ENV

      - name: Update versions.json
        run: |
          python3 - <<EOF
          import json, os
          try:
              with open("versions.json") as f:
                  existing = json.load(f)
          except FileNotFoundError:
              existing = {}
          new_versions = json.loads(os.environ["VERSIONS_JSON"])
          existing.update(new_versions)
          with open("versions.json", "w") as f:
              json.dump(existing, f, indent=2)
          EOF

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git diff --cached --quiet || git commit -m "chore: update built versions [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
