name: Build yay

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    name: Build yay
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Update system & install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            git \
            go \
            base-devel \
            sudo

      - name: Create build user
        # makepkg refuses to run as root, so we need a non-root user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: Jguer/yay
          ref: next  # or pin to a tag like v12.3.5
          path: yay

      - name: Fix ownership for build user
        run: chown -R builder:builder yay

      - name: Build yay binary
        run: |
          su builder -c "
            cd yay
            go build -v -trimpath -ldflags '-s -w' -o yay .
          "

      - name: Run tests
        run: |
          su builder -c "
            cd yay
            go test ./...
          "

      - name: Verify binary
        run: |
          ./yay/yay --version

      - name: Upload yay binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: yay-linux-x86_64
          path: yay/yay
          retention-days: 7

      - name: Build PKGBUILD package (optional)
        if: github.event_name == 'release'
        run: |
          su builder -c "
            cd yay
            makepkg -si --noconfirm
          "

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: yay/yay
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
